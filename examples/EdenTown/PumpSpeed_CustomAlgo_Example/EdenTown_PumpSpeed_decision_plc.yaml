# EdenTown Variable Pump Speed Control Example
# =============================================
# This configuration demonstrates INTELLIGENT PUMP SPEED CONTROL where custom
# algorithms return numeric values (0.0 to 2.0) based on tank levels.
#
# Key Points:
# 1. Custom algorithms return float values for pump speed
# 2. Speed 0.0 = OFF, 1.0 = normal, 1.5 = 150%, 2.0 = max
# 3. WaCSim passes the numeric value to EPANET's SETTING property
# 4. Pump speed depends on tank level (lower tank = faster pump)
#
# Control Logic:
# - P1 (controlled by PLC4): Speed based on T1 level
# - P2 (controlled by PLC1): Speed based on T2 level
# - Tank < 2m → Speed 1.5 (150%)
# - Tank < 4m → Speed 1.2 (120%)
# - Tank < 6m → Speed 1.0 (100%)
# - Tank < 8m → Speed 0.5 (50%)
# - Tank >= 8m → Speed 0.0 (OFF)
#
# Expected Output:
# - Watch the results CSV to see pump speed varying with tank level
# - More efficient than simple on/off control

- name: PLC1
  actuators:
    # PUMP SPEED CONTROL: P2 speed depends on T2 tank level
    - name: P2
      decision_maker: examples/EdenTown/PumpSpeed_CustomAlgo_Example/CustomAlgos/PumpSpeed_P2_Algo.py
      dependents: [T2]  # Tank T2 level needed for speed calculation

- name: PLC4
  actuators:
    # PUMP SPEED CONTROL: P1 speed depends on T1 tank level
    - name: P1
      decision_maker: examples/EdenTown/PumpSpeed_CustomAlgo_Example/CustomAlgos/PumpSpeed_P1_Algo.py
      dependents: [T1]  # Tank T1 level needed for speed calculation

