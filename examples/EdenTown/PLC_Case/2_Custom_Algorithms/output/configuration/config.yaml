attacks:
  network_attacks:
  - direction: destination
    name: plc4AttackerUnit
    target: PLC4
    trigger:
      end: 350
      start: 145
      type: time
    type: simple_dos
decision_maker_per_plc:
- actuators:
  - decision_maker: examples/EdenTown/NewPLC_Case/2_Custom_Algorithms/PLCAlgos/V5_Algo.py
    dependents:
    - T1
    - J5
    name: V5
  name: PLC2
- actuators:
  - decision_maker: examples/EdenTown/NewPLC_Case/2_Custom_Algorithms/PLCAlgos/V4_Algo.py
    dependents:
    - T2
    - J4
    name: V4
  name: PLC3
- actuators:
  - decision_maker: examples/EdenTown/NewPLC_Case/2_Custom_Algorithms/PLCAlgos/P1_Algo.py
    dependents:
    - J1
    - P1F
    name: P1
  name: PLC4
demand: pdd
demand_patterns: demands_EdenTown.csv
inp_file: EdenTown.inp
iterations: 500
log_level: debug
mode: plccontrol
network_topology_type: complex
output_path: output
plcs:
- actuators:
  - P2
  name: PLC1
- actuators:
  - V5
  name: PLC2
  sensors:
  - T1
  - V5F
  - J5
- actuators:
  - V4
  name: PLC3
  sensors:
  - T2
  - V4F
  - J4
- actuators:
  - P1
  name: PLC4
  sensors:
  - J1
  - P1F
  - V1F
