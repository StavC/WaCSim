# EdenTown Stateful Alternating Pump Control Example
# ==================================================
# This configuration demonstrates the NEW FEATURE where custom algorithms
# can be used WITHOUT defining control rules in the INP file.
#
# Key Points:
# 1. NO [CONTROLS] section needed in the INP file for P1 or P2
# 2. The 'dependents' field is optional (empty for time-based algorithms)
# 3. WaCSim automatically creates synthetic controls
# 4. Algorithms execute at every iteration and maintain state via JSON files
#
# Control Logic:
# - P1 (controlled by PLC4): 5 iterations OPEN, 5 iterations CLOSED, repeat
# - P2 (controlled by PLC1): 5 iterations OPEN, 5 iterations CLOSED, repeat
# - V4 and V5 still use the original custom algorithms (backward compatibility)
# - State persists in P1_state.json and P2_state.json files

- name: PLC1
  actuators:
    # NEW FEATURE: P2 controlled by custom algorithm WITHOUT INP control
    - name: P2
      decision_maker: examples/EdenTown/OddEven_CustomAlgo_Example/CustomAlgos/OddEven_P2_Algo.py
      dependents: []  # No sensors needed - stateful time-based control

- name: PLC2
  actuators:
    # BACKWARD COMPATIBILITY: V5 uses the original approach (INP control exists)
    - name: V5
      decision_maker: examples/EdenTown/PLC_Case/PLCAlgos/V5_Algo.py

- name: PLC3
  actuators:
    # BACKWARD COMPATIBILITY: V4 uses the original approach (INP control exists)
    - name: V4
      decision_maker: examples/EdenTown/PLC_Case/PLCAlgos/V4_Algo.py

- name: PLC4
  actuators:
    # NEW FEATURE: P1 controlled by custom algorithm WITHOUT INP control
    - name: P1
      decision_maker: examples/EdenTown/OddEven_CustomAlgo_Example/CustomAlgos/OddEven_P1_Algo.py
      dependents: []  # No sensors needed - stateful time-based control

